name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path libfprint-bridge/Cargo.toml -- --check
      - name: Check driver targets
        run: cargo check --all-targets --all-features
      - name: Test driver core
        run: cargo test --all-targets
      - name: Lint driver targets
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test C ABI bridge
        run: cargo test --manifest-path libfprint-bridge/Cargo.toml
      - name: Lint C ABI bridge
        run: cargo clippy --manifest-path libfprint-bridge/Cargo.toml --all-targets -- -D warnings
      - name: Check bridge pkg-config staging
        run: |
          cargo build --release --manifest-path libfprint-bridge/Cargo.toml

          STAGE="$RUNNER_TEMP/goodix550a-bridge-stage"
          MOVED_STAGE="$RUNNER_TEMP/goodix550a-bridge-stage-moved"

          python3 libfprint-bridge/prepare-pkg-config.py --prefix "$STAGE"

          PKG_CONFIG_PATH="$STAGE/lib/pkgconfig" \
            pkg-config --validate goodix550a-bridge

          if grep -F "$GITHUB_WORKSPACE" \
            "$STAGE/lib/pkgconfig/goodix550a-bridge.pc"; then
            echo "generated pkg-config file contains the checkout path"
            exit 1
          fi

          mv "$STAGE" "$MOVED_STAGE"

          PKG_CONFIG_PATH="$MOVED_STAGE/lib/pkgconfig" \
            pkg-config --validate goodix550a-bridge

          PKG_CONFIG_PATH="$MOVED_STAGE/lib/pkgconfig" \
            pkg-config --cflags --libs goodix550a-bridge
