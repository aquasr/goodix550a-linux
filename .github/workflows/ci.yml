name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path libfprint-bridge/Cargo.toml -- --check
      - name: Check driver targets
        run: cargo check --all-targets --all-features
      - name: Test driver core
        run: cargo test --all-targets
      - name: Lint driver targets
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test C ABI bridge
        run: cargo test --manifest-path libfprint-bridge/Cargo.toml
      - name: Lint C ABI bridge
        run: cargo clippy --manifest-path libfprint-bridge/Cargo.toml --all-targets -- -D warnings
